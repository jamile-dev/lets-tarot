name: Deploy API to Render

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "render.yaml"
  workflow_dispatch:
  # Deploy via webhook - triggered manually from Render dashboard
  # or set up a deploy hook URL in Render → Service → Settings → Deploy Hooks

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go (verify build)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify API builds
        working-directory: api
        run: go build -v ./cmd/server/

      - name: Trigger Render deploy
        uses: render-examples/render-deploy@v1
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_for_success: true
          clear_cache: true

# Lets-Tarot API on Render
# Deploy with: https://render.com/deploy?repo=https://github.com/jamile-dev/lets-tarot
# Or connect repo in Render Dashboard → New Web Service → select this Blueprint file
# Render auto-creates the PostgreSQL database and wires DATABASE_URL

services:
  - type: web
    name: lets-tarot-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: CLIENT_URL
        value: https://jamile-dev.github.io
      - key: CDN_BASE_URL
        value: https://cdn.jsdelivr.net/gh/jamile-dev/lets-tarot@v0.1.0/cards
      - key: DATABASE_URL
        fromDatabase:
          name: lets-tarot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: lets-tarot-db
    plan: free
    region: oregon
